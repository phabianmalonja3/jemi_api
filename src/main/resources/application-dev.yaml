spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      auto-commit: true
  main:
    allow-bean-definition-overriding: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      data:
        redis:
          host: localhost
          port: 6379
          timeout: 2000ms
          lettuce:
#            pool:
#              max-active: 8
#              max-idle: 8
#              min-idle: 0
          config:
            notify-keyspace-events: Ex
springdoc:
    swagger-ui:
              path: ${API_DOC}
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}

  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always


web:
   frontend-url: ${WEB_URL}